<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&amp;display=swap');
      text { font-family: 'IBM Plex Mono', monospace; }
      .bg { fill: #0E1111; }
      .primary-text { fill: #E6E1D5; }
      .secondary-text { fill: #8C918D; }
      .bronze { fill: #C5A46D; }
      .teal { fill: #6F918A; }
      .success { fill: #91A88F; }
      .border { fill: none; stroke: #303534; stroke-width: 1; }
      
      @keyframes fillBar {
        from { width: 0; }
        to { width: 100%; }
      }
      .fill { animation: fillBar 2s ease-out forwards; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="200" class="bg"/>
  
  <!-- Border -->
  <rect x="10" y="10" width="580" height="180" class="border" rx="2"/>
  
  <!-- Corner accents -->
  <path d="M10 25 L10 10 L25 10" fill="none" stroke="#C5A46D" stroke-width="1.5"/>
  <path d="M575 10 L590 10 L590 25" fill="none" stroke="#C5A46D" stroke-width="1.5"/>
  
  <!-- Puzzle ID -->
  <text x="30" y="40" class="teal" font-size="10" letter-spacing="2">PUZZLE_01</text>
  
  <!-- Project name -->
  <text x="30" y="70" class="primary-text" font-size="16" font-weight="700" letter-spacing="1">CIVIC ISSUE PLATFORM</text>
  
  <!-- Objective -->
  <text x="30" y="95" class="secondary-text" font-size="9" letter-spacing="1">OBJECTIVE</text>
  <text x="30" y="110" class="primary-text" font-size="10">Build a platform connecting citizens with authorities.</text>
  
  <!-- Stack -->
  <text x="30" y="135" class="secondary-text" font-size="9" letter-spacing="1">STACK</text>
  <text x="30" y="150" class="bronze" font-size="10">React Native · Node · MongoDB · Socket.io</text>
  
  <!-- Status bar -->
  <text x="30" y="175" class="secondary-text" font-size="9" letter-spacing="1">STATUS</text>
  <rect x="90" y="167" width="200" height="8" fill="#303534" rx="2"/>
  <rect x="90" y="167" width="200" height="8" fill="#91A88F" rx="2" class="fill"/>
  <text x="300" y="175" class="success" font-size="9" letter-spacing="1">SOLVED</text>
  
  <!-- Decorative elements -->
  <circle cx="560" cy="40" r="3" fill="#C5A46D"/>
  <circle cx="560" cy="160" r="3" fill="#303534"/>
</svg>