<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&amp;display=swap');
      text { font-family: 'IBM Plex Mono', monospace; }
      .bg { fill: #0E1111; }
      .primary-text { fill: #E6E1D5; }
      .secondary-text { fill: #8C918D; }
      .bronze { fill: #C5A46D; }
      .teal { fill: #6F918A; }
      .border { fill: none; stroke: #303534; stroke-width: 1; }
      
      @keyframes fillBar {
        from { width: 0; }
        to { width: var(--target-width); }
      }
      .fill-100 { --target-width: 200px; animation: fillBar 2s ease-out forwards; }
      .fill-75 { --target-width: 150px; animation: fillBar 2s ease-out forwards; }
      .fill-40 { --target-width: 80px; animation: fillBar 2s ease-out forwards; }
      .fill-30 { --target-width: 60px; animation: fillBar 2s ease-out forwards; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="250" class="bg"/>
  
  <!-- Border -->
  <rect x="10" y="10" width="580" height="230" class="border" rx="2"/>
  
  <!-- Corner accents -->
  <path d="M10 25 L10 10 L25 10" fill="none" stroke="#C5A46D" stroke-width="1.5"/>
  <path d="M575 10 L590 10 L590 25" fill="none" stroke="#C5A46D" stroke-width="1.5"/>
  
  <!-- Trial ID -->
  <text x="30" y="40" class="teal" font-size="10" letter-spacing="2">TRIAL_007</text>
  
  <!-- Objective -->
  <text x="30" y="70" class="secondary-text" font-size="9" letter-spacing="1">OBJECTIVE</text>
  <text x="30" y="90" class="primary-text" font-size="14" font-weight="700" letter-spacing="1">MASTER SPRING BOOT</text>
  
  <!-- Progress bars -->
  <text x="30" y="120" class="secondary-text" font-size="9" letter-spacing="1">PROGRESS</text>
  
  <!-- REST APIs -->
  <text x="30" y="145" class="primary-text" font-size="10">REST APIs</text>
  <rect x="200" y="137" width="200" height="8" fill="#303534" rx="2"/>
  <rect x="200" y="137" width="200" height="8" fill="#91A88F" rx="2" class="fill-100"/>
  <text x="410" y="145" class="success" font-size="9">100%</text>
  
  <!-- JPA / Hibernate -->
  <text x="30" y="170" class="primary-text" font-size="10">JPA / Hibernate</text>
  <rect x="200" y="162" width="200" height="8" fill="#303534" rx="2"/>
  <rect x="200" y="162" width="150" height="8" fill="#6F918A" rx="2" class="fill-75"/>
  <text x="410" y="170" class="teal" font-size="9">75%</text>
  
  <!-- Security -->
  <text x="30" y="195" class="primary-text" font-size="10">Security</text>
  <rect x="200" y="187" width="200" height="8" fill="#303534" rx="2"/>
  <rect x="200" y="187" width="80" height="8" fill="#C5A46D" rx="2" class="fill-40"/>
  <text x="410" y="195" class="bronze" font-size="9">40%</text>
  
  <!-- System Design -->
  <text x="30" y="220" class="primary-text" font-size="10">System Design</text>
  <rect x="200" y="212" width="200" height="8" fill="#303534" rx="2"/>
  <rect x="200" y="212" width="60" height="8" fill="#8C918D" rx="2" class="fill-30"/>
  <text x="410" y="220" class="secondary-text" font-size="9">30%</text>
  
  <!-- Status -->
  <text x="30" y="245" class="secondary-text" font-size="9" letter-spacing="1">STATUS: IN_PROGRESS</text>
</svg>