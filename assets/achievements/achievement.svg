    <text x="60" y="45" text-anchor="middle" class="secondary-text" font-size="7" letter-spacing="1">POSITION</text>
    <text x="60" y="60" text-anchor="middle" class="primary-text" font-size="8" font-weight="500">HACKERABAD</text>
    <text x="60" y="72" text-anchor="middle" class="primary-text" font-size="8" font-weight="500">MEMBER</text>
    <text x="60" y="90" text-anchor="middle" class="success" font-size="8">✓ UNLOCKED</text>
  </g>
  <g transform="translate(290, 10)">
    <rect width="120" height="100" fill="none" stroke="#303534" stroke-width="1" rx="2"/>
    <polygon points="60,10 65,20 60,30 55,20" fill="#C5A46D" class="pulse"/>
    <text x="60" y="45" text-anchor="middle" class="secondary-text" font-size="7" letter-spacing="1">POSITION</text>
    <text x="60" y="60" text-anchor="middle" class="primary-text" font-size="8" font-weight="500">CISCO CLUB</text>
    <text x="60" y="72" text-anchor="middle" class="primary-text" font-size="8" font-weight="500">MEDIA HEAD</text>
    <text x="60" y="90" text-anchor="middle" class="success" font-size="8">✓ UNLOCKED</text>
  </g>
  <g transform="translate(430, 10)">
    <rect width="120" height="100" fill="none" stroke="#303534" stroke-width="1" rx="2"/>
    <polygon points="60,10 65,20 60,30 55,20" fill="#C5A46D" class="pulse"/>
    <text x="60" y="45" text-anchor="middle" class="secondary-text" font-size="7" letter-spacing="1">POSITION</text>
    <text x="60" y="60" text-anchor="middle" class="primary-text" font-size="8" font-weight="500">3CLOUD</text>
    <text x="60" y="72" text-anchor="middle" class="primary-text" font-size="8" font-weight="500">ORG. EXECUTIVE</text>
    <text x="60" y="90" text-anchor="middle" class="success" font-size="8">✓ UNLOCKED</text>
  </g>
  <g transform="translate(570, 10)">
    <rect width="120" height="100" fill="none" stroke="#303534" stroke-width="1" rx="2"/>
    <polygon points="60,10 65,20 60,30 55,20" fill="#C5A46D" class="pulse"/>
    <text x="60" y="45" text-anchor="middle" class="secondary-text" font-size="7" letter-spacing="1">POSITION</text>
    <text x="60" y="60" text-anchor="middle" class="primary-text" font-size="8" font-weight="500">GDC</text>
    <text x="60" y="72" text-anchor="middle" class="primary-text" font-size="8" font-weight="500">TECH. EXECUTIVE</text>
