<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" width="700" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&amp;display=swap');
      text { font-family: 'IBM Plex Mono', monospace; }
      .bg { fill: #0E1111; }
      .primary-text { fill: #E6E1D5; }
      .secondary-text { fill: #8C918D; }
      .bronze { fill: #C5A46D; }
      .teal { fill: #6F918A; }
      .success { fill: #91A88F; }
      @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="700" height="120" class="bg"/>
  <g transform="translate(10, 10)">
    <rect width="120" height="100" fill="none" stroke="#303534" stroke-width="1" rx="2"/>
    <polygon points="60,10 65,20 60,30 55,20" fill="#C5A46D" class="pulse"/>
    <text x="60" y="45" text-anchor="middle" class="secondary-text" font-size="7" letter-spacing="1">POSITION</text>
    <text x="60" y="60" text-anchor="middle" class="primary-text" font-size="8" font-weight="500">IEC CLUB</text>
    <text x="60" y="72" text-anchor="middle" class="primary-text" font-size="8" font-weight="500">MEMBER</text>
    <text x="60" y="90" text-anchor="middle" class="success" font-size="8">✓ UNLOCKED</text>
  </g>
  <g transform="translate(150, 10)">
    <rect width="120" height="100" fill="none" stroke="#303534" stroke-width="1" rx="2"/>
