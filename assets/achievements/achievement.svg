<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&amp;display=swap');
      text { font-family: 'IBM Plex Mono', monospace; }
      .bg { fill: #0E1111; }
      .primary-text { fill: #E6E1D5; }
      .secondary-text { fill: #8C918D; }
      .bronze { fill: #C5A46D; }
      .teal { fill: #6F918A; }
      .success { fill: #91A88F; }
      
      @keyframes unlock {
        0% { opacity: 0; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.05); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .unlock { animation: unlock 0.8s ease-out forwards; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="200" class="bg"/>
  
  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" class="secondary-text" font-size="11" letter-spacing="3">06 // SIMULATION RECORD</text>
  
  <!-- Achievement cards -->
  <!-- Card 1 -->
  <g transform="translate(50, 50)">
    <rect width="120" height="120" fill="none" stroke="#303534" stroke-width="1" rx="2"/>
    <polygon points="60,15 65,25 60,35 55,25" fill="#C5A46D" class="pulse"/>
    <text x="60" y="55" text-anchor="middle" class="secondary-text" font-size="8" letter-spacing="1">ACHIEVEMENT</text>
    <text x="60" y="75" text-anchor="middle" class="primary-text" font-size="9" font-weight="500">NATIONAL</text>
    <text x="60" y="88" text-anchor="middle" class="primary-text" font-size="9" font-weight="500">HACKATHON</text>
    <text x="60" y="108" text-anchor="middle" class="success" font-size="10">✓ UNLOCKED</text>
  </g>
  
  <!-- Card 2 -->
  <g transform="translate(190, 50)">
    <rect width="120" height="120" fill="none" stroke="#303534" stroke-width="1" rx="2"/>
    <polygon points="60,15 65,25 60,35 55,25" fill="#C5A46D" class="pulse"/>
    <text x="60" y="55" text-anchor="middle" class="secondary-text" font-size="8" letter-spacing="1">ACHIEVEMENT</text>
    <text x="60" y="75" text-anchor="middle" class="primary-text" font-size="9" font-weight="500">ML</text>
    <text x="60" y="88" text-anchor="middle" class="primary-text" font-size="9" font-weight="500">INTERNSHIP</text>
    <text x="60" y="108" text-anchor="middle" class="success" font-size="10">✓ UNLOCKED</text>
  </g>
  
  <!-- Card 3 -->
  <g transform="translate(330, 50)">
    <rect width="120" height="120" fill="none" stroke="#303534" stroke-width="1" rx="2"/>
    <polygon points="60,15 65,25 60,35 55,25" fill="#C5A46D" class="pulse"/>
    <text x="60" y="55" text-anchor="middle" class="secondary-text" font-size="8" letter-spacing="1">ACHIEVEMENT</text>
    <text x="60" y="75" text-anchor="middle" class="primary-text" font-size="9" font-weight="500">FULL-STACK</text>
    <text x="60" y="88" text-anchor="middle" class="primary-text" font-size="9" font-weight="500">DEVELOPMENT</text>
    <text x="60" y="108" text-anchor="middle" class="success" font-size="10">✓ UNLOCKED</text>
  </g>
  
  <!-- Card 4 -->
  <g transform="translate(470, 50)">
    <rect width="120" height="120" fill="none" stroke="#303534" stroke-width="1" rx="2"/>
    <polygon points="60,15 65,25 60,35 55,25" fill="#C5A46D" class="pulse"/>
    <text x="60" y="55" text-anchor="middle" class="secondary-text" font-size="8" letter-spacing="1">ACHIEVEMENT</text>
    <text x="60" y="75" text-anchor="middle" class="primary-text" font-size="9" font-weight="500">AI / ML</text>
    <text x="60" y="88" text-anchor="middle" class="primary-text" font-size="9" font-weight="500">PROJECTS</text>
    <text x="60" y="108" text-anchor="middle" class="success" font-size="10">✓ UNLOCKED</text>
  </g>
  
  <!-- Card 5 -->
  <g transform="translate(530, 50)">
    <rect width="120" height="120" fill="none" stroke="#303534" stroke-width="1" rx="2"/>
    <polygon points="60,15 65,25 60,35 55,25" fill="#C5A46D" class="pulse"/>
    <text x="60" y="55" text-anchor="middle" class="secondary-text" font-size="8" letter-spacing="1">ACHIEVEMENT</text>
    <text x="60" y="75" text-anchor="middle" class="primary-text" font-size="9" font-weight="500">TECH</text>
    <text x="60" y="88" text-anchor="middle" class="primary-text" font-size="9" font-weight="500">CLUB</text>
    <text x="60" y="108" text-anchor="middle" class="success" font-size="10">✓ UNLOCKED</text>
  </g>
  
  <!-- Bottom status -->
  <text x="350" y="190" text-anchor="middle" class="secondary-text" font-size="9" letter-spacing="1">RECORD UPDATED</text>
</svg>