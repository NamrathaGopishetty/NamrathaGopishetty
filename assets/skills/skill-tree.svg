<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700" height="350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&amp;display=swap');
      text { font-family: 'IBM Plex Mono', monospace; }
      .bg { fill: #0E1111; }
      .primary-text { fill: #E6E1D5; }
      .secondary-text { fill: #8C918D; }
      .bronze { fill: #C5A46D; }
      .teal { fill: #6F918A; }
      .border { fill: none; stroke: #303534; stroke-width: 1; }
      .node { fill: #0E1111; stroke: #C5A46D; stroke-width: 1.5; }
      .node-active { fill: #C5A46D; stroke: #C5A46D; stroke-width: 1.5; }
      .connection { stroke: #303534; stroke-width: 1; stroke-dasharray: 4,4; }
      .connection-active { stroke: #6F918A; stroke-width: 1.5; }
      
      @keyframes drawLine {
        from { stroke-dashoffset: 100; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes activateNode {
        0% { fill: #0E1111; }
        100% { fill: #C5A46D; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .draw { animation: drawLine 2s ease-out forwards; stroke-dasharray: 100; stroke-dashoffset: 100; }
      .activate { animation: activateNode 0.5s ease-out forwards; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="350" class="bg"/>
  
  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" class="secondary-text" font-size="11" letter-spacing="3">02 // CAPABILITIES</text>
  
  <!-- Root node: SOFTWARE -->
  <circle cx="350" cy="70" r="8" class="node-active"/>
  <text x="350" y="60" text-anchor="middle" class="primary-text" font-size="12" font-weight="700" letter-spacing="2">SOFTWARE</text>
  
  <!-- Connection lines -->
  <line x1="350" y1="78" x2="350" y2="100" class="connection-active draw"/>
  <line x1="200" y1="100" x2="500" y2="100" class="connection-active draw"/>
  <line x1="200" y1="100" x2="200" y2="120" class="connection-active draw"/>
  <line x1="500" y1="100" x2="500" y2="120" class="connection-active draw"/>
  
  <!-- Backend branch -->
  <circle cx="200" cy="130" r="6" class="node-active"/>
  <text x="200" y="155" text-anchor="middle" class="primary-text" font-size="11" font-weight="500" letter-spacing="1">BACKEND</text>
  
  <!-- AI/ML branch -->
  <circle cx="500" cy="130" r="6" class="node-active"/>
  <text x="500" y="155" text-anchor="middle" class="primary-text" font-size="11" font-weight="500" letter-spacing="1">AI / ML</text>
  
  <!-- Backend sub-connections -->
  <line x1="150" y1="136" x2="150" y2="170" class="connection draw"/>
  <line x1="250" y1="136" x2="250" y2="170" class="connection draw"/>
  
  <!-- AI/ML sub-connections -->
  <line x1="450" y1="136" x2="450" y2="170" class="connection draw"/>
  <line x1="550" y1="136" x2="550" y2="170" class="connection draw"/>
  
  <!-- Java node -->
  <rect x="120" y="175" width="60" height="25" class="node" rx="2"/>
  <text x="150" y="192" text-anchor="middle" class="bronze" font-size="10" letter-spacing="1">JAVA</text>
  
  <!-- Python node -->
  <rect x="220" y="175" width="60" height="25" class="node" rx="2"/>
  <text x="250" y="192" text-anchor="middle" class="bronze" font-size="10" letter-spacing="1">PYTHON</text>
  
  <!-- ML node -->
  <rect x="420" y="175" width="60" height="25" class="node" rx="2"/>
  <text x="450" y="192" text-anchor="middle" class="teal" font-size="10" letter-spacing="1">ML</text>
  
  <!-- GenAI node -->
  <rect x="520" y="175" width="60" height="25" class="node" rx="2"/>
  <text x="550" y="192" text-anchor="middle" class="teal" font-size="10" letter-spacing="1">GENAI</text>
  
  <!-- Spring Boot connection -->
  <line x1="150" y1="200" x2="150" y2="230" class="connection draw"/>
  <rect x="115" y="235" width="70" height="25" class="node" rx="2"/>
  <text x="150" y="252" text-anchor="middle" class="primary-text" font-size="9" letter-spacing="1">SPRING BOOT</text>
  
  <!-- FastAPI connection -->
  <line x1="250" y1="200" x2="250" y2="230" class="connection draw"/>
  <rect x="215" y="235" width="70" height="25" class="node" rx="2"/>
  <text x="250" y="252" text-anchor="middle" class="primary-text" font-size="9" letter-spacing="1">FASTAPI</text>
  
  <!-- Sklearn connection -->
  <line x1="450" y1="200" x2="450" y2="230" class="connection draw"/>
  <rect x="415" y="235" width="70" height="25" class="node" rx="2"/>
  <text x="450" y="252" text-anchor="middle" class="primary-text" font-size="9" letter-spacing="1">SKLEARN</text>
  
  <!-- Databases connection -->
  <line x1="150" y1="260" x2="150" y2="280" class="connection draw"/>
  <text x="150" y="300" text-anchor="middle" class="secondary-text" font-size="10" letter-spacing="1">DATABASES</text>
  
  <!-- Database nodes -->
  <line x1="100" y1="305" x2="100" y2="320" class="connection draw"/>
  <line x1="200" y1="305" x2="200" y2="320" class="connection draw"/>
  
  <rect x="65" y="325" width="70" height="20" class="node" rx="2"/>
  <text x="100" y="339" text-anchor="middle" class="teal" font-size="8" letter-spacing="1">POSTGRESQL</text>
  
  <rect x="165" y="325" width="70" height="20" class="node" rx="2"/>
  <text x="200" y="339" text-anchor="middle" class="teal" font-size="8" letter-spacing="1">MONGODB</text>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="30" r="3" fill="#303534"/>
  <circle cx="670" cy="30" r="3" fill="#303534"/>
  <circle cx="30" cy="320" r="3" fill="#303534"/>
  <circle cx="670" cy="320" r="3" fill="#303534"/>
</svg>