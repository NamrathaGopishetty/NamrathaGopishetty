<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&amp;display=swap');
      text { font-family: 'IBM Plex Mono', monospace; }
      .bg { fill: #0E1111; }
      .primary-text { fill: #E6E1D5; }
      .secondary-text { fill: #8C918D; }
      .bronze { fill: #C5A46D; }
      .teal { fill: #6F918A; }
      .border { fill: none; stroke: #303534; stroke-width: 1; }
      
      @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
      @keyframes scan {
        0% { transform: translateY(0); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(300px); opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes fillBar {
        from { width: 0; }
        to { width: 100%; }
      }
      .cursor { animation: blink 1s step-end infinite; }
      .scan-line { animation: scan 3s linear infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .rotate { animation: rotate 20s linear infinite; transform-origin: center; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" class="bg"/>
  
  <!-- Border -->
  <rect x="20" y="20" width="760" height="360" class="border" rx="2"/>
  
  <!-- Corner accents -->
  <path d="M20 50 L20 20 L50 20" fill="none" stroke="#C5A46D" stroke-width="2"/>
  <path d="M750 20 L780 20 L780 50" fill="none" stroke="#C5A46D" stroke-width="2"/>
  <path d="M780 350 L780 380 L750 380" fill="none" stroke="#C5A46D" stroke-width="2"/>
  <path d="M50 380 L20 380 L20 350" fill="none" stroke="#C5A46D" stroke-width="2"/>
  
  <!-- Top status bar -->
  <text x="40" y="45" class="secondary-text" font-size="11" letter-spacing="2">SIMULATION_01</text>
  <text x="680" y="45" class="secondary-text" font-size="11" letter-spacing="2">SYSTEM:</text>
  <circle cx="745" cy="41" r="4" fill="#91A88F"/>
  <text x="755" y="45" class="teal" font-size="11" letter-spacing="2">ACTIVE</text>
  
  <!-- Horizontal lines -->
  <line x1="40" y1="60" x2="760" y2="60" stroke="#303534" stroke-width="1"/>
  
  <!-- Puzzle symbol (center) -->
  <g transform="translate(400, 140)">
    <g class="rotate">
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="none" stroke="#C5A46D" stroke-width="1.5"/>
      <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" fill="none" stroke="#6F918A" stroke-width="1"/>
    </g>
    <circle cx="0" cy="0" r="4" fill="#C5A46D" class="pulse"/>
  </g>
  
  <!-- Main title -->
  <text x="400" y="200" text-anchor="middle" class="primary-text" font-size="36" font-weight="700" letter-spacing="8">NAMRATHA</text>
  
  <!-- Subtitle -->
  <text x="400" y="230" text-anchor="middle" class="secondary-text" font-size="13" letter-spacing="4">SOFTWARE DEVELOPER</text>
  
  <!-- Decorative line -->
  <line x1="300" y1="250" x2="370" y2="250" stroke="#C5A46D" stroke-width="1"/>
  <polygon points="400,245 405,250 400,255 395,250" fill="#C5A46D"/>
  <line x1="430" y1="250" x2="500" y2="250" stroke="#C5A46D" stroke-width="1"/>
  
  <!-- Status text -->
  <text x="400" y="280" text-anchor="middle" class="teal" font-size="12" letter-spacing="3">SIMULATION ACTIVE</text>
  
  <!-- Bottom decorative elements -->
  <line x1="40" y1="340" x2="760" y2="340" stroke="#303534" stroke-width="1"/>
  
  <!-- Scanning line effect -->
  <rect x="40" y="70" width="720" height="2" fill="#6F918A" opacity="0.3" class="scan-line"/>
  
  <!-- Bottom status -->
  <text x="40" y="365" class="secondary-text" font-size="10" letter-spacing="1">READY</text>
  <text x="720" y="365" class="secondary-text" font-size="10" letter-spacing="1">v1.0</text>
</svg>