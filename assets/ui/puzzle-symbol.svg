<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .rotate { animation: rotate 20s linear infinite; transform-origin: center; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>
  
  <!-- Outer hexagon -->
  <g class="rotate">
    <polygon points="50,10 85,27.5 85,72.5 50,90 15,72.5 15,27.5" fill="none" stroke="#C5A46D" stroke-width="1.5"/>
  </g>
  
  <!-- Inner hexagon -->
  <g class="rotate" style="animation-direction: reverse;">
    <polygon points="50,25 70,35 70,65 50,75 30,65 30,35" fill="none" stroke="#6F918A" stroke-width="1"/>
  </g>
  
  <!-- Center dot -->
  <circle cx="50" cy="50" r="4" fill="#C5A46D" class="pulse"/>
  
  <!-- Connection points -->
  <circle cx="50" cy="10" r="2" fill="#C5A46D"/>
  <circle cx="85" cy="27.5" r="2" fill="#C5A46D"/>
  <circle cx="85" cy="72.5" r="2" fill="#C5A46D"/>
  <circle cx="50" cy="90" r="2" fill="#C5A46D"/>
  <circle cx="15" cy="72.5" r="2" fill="#C5A46D"/>
  <circle cx="15" cy="27.5" r="2" fill="#C5A46D"/>
</svg>