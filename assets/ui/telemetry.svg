<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&amp;display=swap');
      text { font-family: 'IBM Plex Mono', monospace; }
      .bg { fill: #0E1111; }
      .primary-text { fill: #E6E1D5; }
      .secondary-text { fill: #8C918D; }
      .bronze { fill: #C5A46D; }
      .teal { fill: #6F918A; }
      .border { fill: none; stroke: #303534; stroke-width: 1; }
      
      @keyframes fillBar {
        from { width: 0; }
        to { width: var(--target-width); }
      }
      .fill-80 { --target-width: 160px; animation: fillBar 2s ease-out forwards; }
      .fill-50 { --target-width: 100px; animation: fillBar 2s ease-out forwards; }
      .fill-70 { --target-width: 140px; animation: fillBar 2s ease-out forwards; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="200" class="bg"/>
  
  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" class="secondary-text" font-size="11" letter-spacing="3">07 // SYSTEM TELEMETRY</text>
  
  <!-- Stats boxes -->
  <!-- Contributions -->
  <g transform="translate(50, 50)">
    <rect width="180" height="120" fill="none" stroke="#303534" stroke-width="1" rx="2"/>
    <text x="20" y="30" class="secondary-text" font-size="9" letter-spacing="1">CONTRIBUTIONS</text>
    <rect x="20" y="45" width="140" height="10" fill="#303534" rx="2"/>
    <rect x="20" y="45" width="112" height="10" fill="#6F918A" rx="2" class="fill-80"/>
    <text x="20" y="80" class="primary-text" font-size="24" font-weight="700">150+</text>
    <text x="20" y="100" class="secondary-text" font-size="9">contributions</text>
  </g>
  
  <!-- Repositories -->
  <g transform="translate(260, 50)">
    <rect width="180" height="120" fill="none" stroke="#303534" stroke-width="1" rx="2"/>
    <text x="20" y="30" class="secondary-text" font-size="9" letter-spacing="1">REPOSITORIES</text>
    <rect x="20" y="45" width="140" height="10" fill="#303534" rx="2"/>
    <rect x="20" y="45" width="70" height="10" fill="#C5A46D" rx="2" class="fill-50"/>
    <text x="20" y="80" class="primary-text" font-size="24" font-weight="700">12</text>
    <text x="20" y="100" class="secondary-text" font-size="9">repositories</text>
  </g>
  
  <!-- Activity -->
  <g transform="translate(470, 50)">
    <rect width="180" height="120" fill="none" stroke="#303534" stroke-width="1" rx="2"/>
    <text x="20" y="30" class="secondary-text" font-size="9" letter-spacing="1">ACTIVITY</text>
    <rect x="20" y="45" width="140" height="10" fill="#303534" rx="2"/>
    <rect x="20" y="45" width="98" height="10" fill="#91A88F" rx="2" class="fill-70"/>
    <text x="20" y="80" class="primary-text" font-size="24" font-weight="700">ACTIVE</text>
    <text x="20" y="100" class="secondary-text" font-size="9">status</text>
  </g>
  
  <!-- Bottom note -->
  <text x="350" y="190" text-anchor="middle" class="secondary-text" font-size="9" letter-spacing="1">GitHub Statistics — Updated Regularly</text>
</svg>